kind = "web"
previewPath = "/"
title = "Fee Calculator"
version = "1.0.0"
id = "artifacts/fee-calculator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23427

[services.development]
run = "pnpm --filter @workspace/fee-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fee-calculator", "run", "build" ]
serve = "static"
publicDir = "artifacts/fee-calculator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23427"
BASE_PATH = "/"
